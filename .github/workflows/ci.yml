name: Enterprise Archetype CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: archetype_user
          POSTGRES_PASSWORD: archetype_pwd
          POSTGRES_DB: archetype_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Validate Backend (Quarkus)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: archetype-backend:test

      - name: Build and Validate Frontend (Next.js)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: archetype-frontend:test

      - name: Run Integration Smoke Test via Docker Compose
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8080/api/health || exit 1
          docker compose down
